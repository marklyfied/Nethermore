- type: entity
  id: NetherWreckSpawner
  parent: MarkerBase
  categories: [Spawner]
  components:
  - type: RandomSpawner
    prototypes:
    - SpawnWreckInvestigator
    - SpawnWreckSprinter
    - SpawnWreckComet
    - SpawnWreckCourserX
    - SpawnWreckCresent
    - SpawnWreckHauler