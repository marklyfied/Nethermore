- type: pointOfInterest
  id: PortVulcan
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Port Vulcan'
  minimumDistance: 500
  maximumDistance: 5000
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueTSF, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce ]
  spawnGroup: Required
  gridPath: /Maps/_Nether/POI/portvulcan.yml
  addComponents:
  - type: IFF
    color: "#37946e"
  - type: VesselInfo
    description: "A neutral port for trade and relaxation."

- type: gameMap
  id: PortVulcan
  mapName: 'Port Vulcan'
  mapPath: /Maps/_Nether/POI/portvulcan.yml
  minPlayers: 0
  stations:
    ZetaNode:
      stationProto: RecordsFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Port Vulcan'
        - type: StationDeadDrop
          maxDeadDrops: 2
        - type: ExtraStationInformation
          icon: /Textures/_Mono/Interface/Misc/LateJoin/lathe.png
          stationSubtext: 'frontier-lobby-portvulcan-subtext'
          stationDescription: 'frontier-lobby-portvulcan-description'
        - type: StationJobs
          availableJobs:
            Mercenary: [ -1, -1 ]
            Contractor: [ -1, -1 ]
            StationRepresentative: [1, 1]
