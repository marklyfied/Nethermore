- type: pointOfInterest
  id: BeaconClusterA
  parent: [BasePOI, BaseRepairablePOI]
  name: 'INSO-357k Asteroid Cluster'
  minimumDistance: 0
  maximumDistance: 100
  posX: 5056
  posY: 4480
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/beaconstation_a.yml
  addComponents:
  - type: IFF
    color: "#ccaa55"
  - type: SolarPoweredGrid
    doNotCull: true

- type: gameMap
  id: BeaconClusterA
  mapName: 'INSO-357k Asteroid Cluster'
  mapPath: /Maps/_Mono/POI/beaconstation_a.yml
  minPlayers: 0
  stations:
    BeaconClusterA:
      stationProto: RecordsFrontierOutpost
      components:
      - type: StationNameSetup
        mapNameTemplate: 'INSO-357k Asteroid Cluster'

